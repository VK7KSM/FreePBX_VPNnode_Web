apply plugin: 'com.android.application'

android {
    namespace "net.elfradio.elfremote"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "net.elfradio.elfremote"
        minSdkVersion 23
        targetSdkVersion 27
        versionCode project.hasProperty("elfVerCode") ? Integer.parseInt("$elfVerCode") : 12
        versionName project.hasProperty("elfVerName") ? "$elfVerName" : "0.1.11-d22xx-upda"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
