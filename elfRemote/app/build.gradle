apply plugin: 'com.android.application'

def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }
if (project.hasProperty('elfVerCode') != project.hasProperty('elfVerName')) {
    throw new GradleException('覆盖构建版本时必须同时指定elfVerCode和elfVerName')
}
def codeText = (project.findProperty('elfVerCode') ?: releaseVersion.getProperty('versionCode'))?.toString()
def nameText = (project.findProperty('elfVerName') ?: releaseVersion.getProperty('versionName'))?.toString()
if (!codeText || !(codeText ==~ /[1-9][0-9]{0,9}/) || codeText.toLong() > 2100000000L
        || !nameText || nameText.trim() != nameText || nameText.length() > 100 || nameText.contains('\n') || nameText.contains('\r')) {
    throw new GradleException('构建版本无效，请检查version.properties或显式版本参数')
}
// 历史名称STATUS_ONLY实际对应正式远程管理分支；false是旧实验分支，不能用于生产制品。
if (nameText.contains('-production-') && project.hasProperty('elfStatusOnly')
        && !Boolean.parseBoolean(project.property('elfStatusOnly').toString())) {
    throw new GradleException('生产版本必须使用正式远程管理分支，禁止elfStatusOnly=false')
}

android {
    namespace "net.elfradio.elfremote"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "net.elfradio.elfremote"
        // 代码实际要求 API 26，这是开了 lint 的 NewApi 之后逐条量出来的，不是估的：
        // Process#waitFor(timeout) 与 #isAlive、ProcessBuilder#redirectOutput、
        // ConnectivityManager#registerDefaultNetworkCallback 都是 26，散布在
        // BootstrapRoot、CorePush、DesktopLauncher、DeviceIdentity、LostDebugGuard 等处；
        // CompletableFuture 与 java.util.stream 是 24。声明 23 等于允许装到一台
        // 必然崩溃的设备上，不如让安装直接被拒。现网三台 D22 都是 Android 8.1（API 27）。
        minSdkVersion 26
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        targetSdkVersion 27
        versionCode codeText.toInteger()
        versionName nameText
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "STATUS_ONLY", project.hasProperty("elfStatusOnly") ? Boolean.parseBoolean("$elfStatusOnly").toString() : "true"
        def controlUrl = project.findProperty("elfControlUrl") ?: "https://v.elfradio.net"
        def endpoint = new URI(controlUrl)
        if (endpoint.scheme != "https" || !endpoint.host || endpoint.userInfo || endpoint.query || endpoint.fragment || (endpoint.path && endpoint.path != "/")) {
            throw new GradleException("控制面必须使用不含凭据和路径的 HTTPS 地址")
        }
        buildConfigField "String", "CONTROL_URL", groovy.json.JsonOutput.toJson(controlUrl.replaceAll('/$', ''))
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 发布构建必须跑 lint。D31 的 1.34.25 就是 API 24 的类用在 API 23 设备上，
        // 编译期无声、装到机器才崩，而 NewApi 本来就能抓到它。
        abortOnError true
        checkReleaseBuilds true
        // 这个库从未开过 lint，一次全开会淹没在历史告警里。先只把最危险的一项设为致命：
        // 调用高于 minSdk 的 API。其余检查等有余力再逐项接。
        checkOnly 'NewApi'
        fatal 'NewApi'
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.15'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
