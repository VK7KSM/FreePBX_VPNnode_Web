name = "freepbx-vpnnode-web"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

# devices-client.js 是浏览器脚本，不能当 Worker 模块执行（会碰 localStorage）。
# 部署前运行 node embed-devices-client.mjs，由 devices-client-source.js 以字符串嵌入。

[[kv_namespaces]]
binding = "SUB_STORE_KV"
id = "833409e1f96d4ef28334811dfec66b52"

[durable_objects]
bindings = [{ name = "ELF_DO", class_name = "ElfStore" }]

[[migrations]]
tag = "v1"
new_classes = ["ElfStore"]
