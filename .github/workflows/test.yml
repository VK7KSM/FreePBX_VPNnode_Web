name: 代码验证
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run embed:check
      - run: npm test
      - run: python3 -m unittest discover -s mqtt-server -p 'test_*.py'
      - run: sh -n mqtt-server/install.sh && sh -n mqtt-server/install-api.sh && sh -n mqtt-server/renew-certificate.sh
