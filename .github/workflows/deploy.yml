name: Deploy Cloudflare Worker

on:
  push:
    branches: [master, main]
    paths:
      - "worker.js"
      - "sip-client.js"
      - "sip-client-source.js"
      - "admin-auth.js"
      - "admin-session.js"
      - "location-history.js"
      - "logo.js"
      - "logo.png"
      - "wrangler.toml"
      - "wrangler.jsonc"
      - "package.json"
      - "devices-client.js"
      - "devices-client-source.js"
      - "embed-devices-client.mjs"
      - "remote-location.js"
      - "elfRemote/control-plane.js"
      - "*.test.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run embed:check
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          command: deploy
