[from-pstn-custom]
exten => 101,1,NoOp(Pixel GSM inbound caller ID normalization)
 same => n,GotoIf($["${CHANNEL(endpoint)}" != "300"]?passthrough)
 same => n,Set(GSM_CALLER_ID=${FILTER(0-9+,${PJSIP_HEADER(read,X-GSM-CallerID)})})
 same => n,GotoIf($["${GSM_CALLER_ID}" = ""]?passthrough)
 same => n,GotoIf($[${LEN(${GSM_CALLER_ID})} < 6 | ${LEN(${GSM_CALLER_ID})} > 16]?passthrough)
 same => n,Set(CALLERID(num)=${GSM_CALLER_ID})
 same => n,Set(CALLERID(name)=${GSM_CALLER_ID})
 same => n,NoOp(Pixel GSM caller ID restored: ${GSM_CALLER_ID})
 same => n(passthrough),Goto(ext-did,101,1)
